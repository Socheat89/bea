<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiến Lên Connect</title>
    <script>
      window.onerror = function (msg, url, lineNo, columnNo, error) {
        var div = document.createElement('div');
        div.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; padding: 20px; background: red; color: white; font-family: monospace; z-index: 9999;';
        div.innerText = 'Global Error: ' + msg + '\nLine: ' + lineNo + '\n' + (error ? error.stack : '');
        document.body.appendChild(div);
        return false;
      };
      window.onunhandledrejection = function (event) {
        var div = document.createElement('div');
        div.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; padding: 20px; background: orange; color: black; font-family: monospace; z-index: 9999;';
        div.innerText = 'Unhandled Promise Rejection: ' + event.reason;
        document.body.appendChild(div);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
